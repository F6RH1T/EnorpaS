<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ENORPA Brülör Yönetimi</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="shell">
    <header><div><small>ENORPA</small><h1>Brülör Yönetimi</h1></div><span id="connection" class="badge">Bağlanıyor…</span></header>
    <section id="message" class="message" hidden></section>
    <section id="loginPanel" class="card">
      <h2>Yönetici girişi</h2>
      <form id="loginForm" class="grid compact">
        <label>E-posta<input id="email" type="email" required autocomplete="username"></label>
        <label>Şifre<input id="password" type="password" required autocomplete="current-password"></label>
        <button type="submit">Giriş yap</button>
      </form>
    </section>
    <section id="adminPanel" hidden>
      <div class="toolbar"><strong id="userEmail"></strong><button id="logout" class="secondary">Çıkış</button></div>
      <section class="card">
        <h2 id="formTitle">Yeni brülör</h2>
        <form id="burnerForm" class="grid">
          <input id="recordId" type="hidden">
          <label>Üretici
            <select id="manufacturer" required>
              <option value="ecoflam">Ecoflam</option>
              <option value="baltur">Baltur</option>
            </select>
          </label>
          <label>Seri<input id="series"></label>
          <label>Model<input id="model" required></label><label>Ürün kodu<input id="productCode"></label>
          <label>Yakıt<input id="fuel"></label><label>Kafa<input id="head"></label>
          <label>Minimum güç (kW)<input id="powerMin" type="number" step="any"></label>
          <label>Maksimum güç (kW)<input id="powerMax" type="number" step="any"></label>
          <fieldset class="dimensions">
            <legend id="dimensionLegend">Ecoflam datasheet ölçüleri</legend>
            <p id="dimensionHelp" class="dimension-help"></p>
            <div id="dimensionFields" class="dimension-fields"></div>
          </fieldset>
          <label class="full-row">Ölçü tablosu / teknik çizim fotoğrafı (en fazla 20 MB)<input id="drawing" type="file" accept="image/jpeg,image/png,image/webp"></label>
          <label class="check"><input id="active" type="checkbox" checked> Aktif</label>
          <div class="actions"><button type="submit">Kaydet</button><button id="cancelEdit" type="button" class="secondary">Temizle</button></div>
        </form>
      </section>
      <section class="card">
        <div class="section-title"><div><h2>Brülörler</h2><p class="muted">Eski kayıtları görüntüleyebilir, PDF teknik fiş açabilir veya düzenleyebilirsin.</p></div><button id="refresh" class="secondary">Yenile</button></div>
        <div class="table-wrap"><table><thead><tr><th>Üretici</th><th>Seri</th><th>Model</th><th>Durum</th><th>Teknik çizim</th><th>İşlemler</th></tr></thead><tbody id="burnerRows"></tbody></table></div>
      </section>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-bootstrap.js"></script>
  <script src="admin.js?v=23"></script>
</body>
</html>
